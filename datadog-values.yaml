# Valores do chart datadog/datadog para o cluster do PosTechChallenge.
#
# Os requests são deliberadamente pequenos: o cluster tem 2 nós Standard_B2s
# (4 vCPU no total, teto da quota da subscription), e o agente não pode competir
# por CPU com a aplicação.

datadog:
  clusterName: postech-aks

  # Coleta de logs de todos os containers, com os logs JSON da aplicação
  # sendo parseados automaticamente pelo Datadog.
  logs:
    enabled: true
    containerCollectAll: true

  # APM: o tracer .NET envia traces para o agente do próprio nó.
  apm:
    portEnabled: true
    socketEnabled: true

  # Métricas de processo e live containers.
  processAgent:
    enabled: true
    processCollection: true

  # Métricas de CPU/memória do cluster (requisito explícito da Fase 3).
  kubeStateMetricsEnabled: true
  kubeStateMetricsCore:
    enabled: true

  # Reduz volume de métricas custom que não usamos, economizando cota do trial.
  lowDataMode: false

agents:
  containers:
    agent:
      resources:
        requests:
          cpu: 100m
          memory: 192Mi
        limits:
          cpu: 300m
          memory: 384Mi
    processAgent:
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 150m
          memory: 192Mi
    traceAgent:
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 150m
          memory: 192Mi

clusterAgent:
  enabled: true
  replicas: 1

  # Auto-instrumentação do .NET: injeta o tracer nos pods que tiverem o label
  # admission.datadoghq.com/enabled: "true", sem mexer no Dockerfile da aplicação.
  admissionController:
    enabled: true
    mutateUnlabelled: false

  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 384Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 30m
      memory: 96Mi
    limits:
      cpu: 100m
      memory: 192Mi
