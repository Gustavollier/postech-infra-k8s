name: Terraform - AKS, APIM e Datadog

# Provisiona AKS, ACR, API Management, Container Apps (Auth Function) e toda a
# camada de observabilidade do Datadog.
#
# Pull request  -> terraform plan, comentado no PR
# Push na main  -> terraform apply
#
# Autenticação no Azure via OIDC. As chaves do Datadog vêm de secrets e entram
# no Terraform como TF_VAR_*, nunca como arquivo versionado.

on:
  push:
    branches: [main, develop]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  TF_VERSION: "1.9.8"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}
  TF_VAR_datadog_app_key: ${{ secrets.DD_APP_KEY }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Comentar o plano no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLANO: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const plano = process.env.PLANO || '';
            const corpo = [
              '### Terraform Plan — AKS, APIM e Datadog',
              '',
              '```terraform',
              plano.length > 60000 ? plano.slice(0, 60000) + '\n... (truncado)' : plano,
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: corpo,
            });

  apply:
    name: Apply
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Login no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # O Container App só pode ser criado depois que a imagem da Function
      # existir no ACR. Se ela ainda não foi publicada, o apply é interrompido
      # com uma mensagem clara em vez de falhar no meio.
      - name: Verificar a imagem da Auth Function no ACR
        run: |
          set -euo pipefail
          if az acr repository show --name postechacr13soat \
               --image postech-auth-function:latest &>/dev/null; then
            echo "Imagem encontrada."
          else
            echo "::error::A imagem postech-auth-function:latest não existe no ACR."
            echo "::error::Rode antes a pipeline do repositório postech-auth-function."
            exit 1
          fi

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve

      - name: Outputs
        run: terraform output -no-color
